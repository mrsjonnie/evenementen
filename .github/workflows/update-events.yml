name: Update evenementen

on:
  workflow_dispatch:
    inputs:
      region:
        description: Regio om te scannen
        required: false
        default: Groningen
      radius:
        description: Straal in km
        required: false
        default: '0'
      category:
        description: Type activiteit
        required: false
        default: all
      query:
        description: Zoekterm
        required: false
        default: ''
      dateFrom:
        description: Startdatum
        required: false
        default: ''
      dateTo:
        description: Einddatum
        required: false
        default: ''
      minResults:
        description: Minimum aantal resultaten
        required: false
        default: '20'
      maxEventsPerSite:
        description: Maximum aantal evenementen per website
        required: false
        default: '20'
      siteTimeLimitSeconds:
        description: Maximale zoektijd per website in seconden
        required: false
        default: '90'
      sites:
        description: Extra websites als JSON-lijst
        required: false
        default: '[]'
      providers:
        description: AI-bronnen als JSON
        required: false
        default: '{}'
      serpApiLinks:
        description: Door SerpAPI gevonden links als JSON-lijst
        required: false
        default: '[]'
      serpApiRawLog:
        description: Ruwe SerpAPI-resultaten als JSON-lijst
        required: false
        default: '[]'
      serpApiEvents:
        description: Door SerpAPI gevonden event-kandidaten als JSON-lijst
        required: false
        default: '[]'
      aiEvents:
        description: Door ChatGPT of Mistral gevonden event-kandidaten als JSON-lijst
        required: false
        default: '[]'
      clearArchive:
        description: Leeg actieve data en archief voor het scrapen
        required: false
        default: 'false'
  push:
    paths:
      - refresh-request.json
  # Automatische planning tijdelijk uitgeschakeld; handmatig starten of via refresh-request.json.

permissions:
  contents: write

# Prevent overlapping scrapes from racing to publish events.json and scrape-progress.json.
concurrency:
  group: scrape-events
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Prepare scraper input
        run: |
          python - <<'PY'
          import json
          import os

          defaults = {
              "region": "Groningen",
              "radius": "0",
              "category": "all",
              "query": "",
              "dateFrom": "",
              "dateTo": "",
              "minResults": "20",
              "maxEventsPerSite": "20",
              "siteTimeLimitSeconds": "20",
              "sites": "[]",
              "providers": "{}",
              "serpApiLinks": "[]",
              "serpApiRawLog": "[]",
              "serpApiEvents": "[]",
              "aiEvents": "[]",
              "clearArchive": "false",
          }

          event = {}
          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if event_path and os.path.exists(event_path):
              with open(event_path, encoding="utf-8") as handle:
                  event = json.load(handle)

          values = dict(defaults)
          values.update(event.get("inputs") or {})

          # Only a push triggered by refresh-request.json should read that file.
          # A manual workflow_dispatch must use its own submitted inputs; otherwise
          # a stale one-site diagnostic request silently overrides the full site list.
          if os.environ.get("GITHUB_EVENT_NAME") == "push" and os.path.exists("refresh-request.json"):
              with open("refresh-request.json", encoding="utf-8") as handle:
                  request = json.load(handle)
              for key in defaults:
                  if key in request:
                      values[key] = request[key]

          mapping = {
              "region": "INPUT_REGION",
              "radius": "INPUT_RADIUS",
              "category": "INPUT_CATEGORY",
              "query": "INPUT_QUERY",
              "dateFrom": "INPUT_DATE_FROM",
              "dateTo": "INPUT_DATE_TO",
              "minResults": "INPUT_MIN_RESULTS",
              "maxEventsPerSite": "INPUT_MAX_EVENTS_PER_SITE",
              "siteTimeLimitSeconds": "INPUT_SITE_TIME_LIMIT_SECONDS",
              "sites": "INPUT_SITES",
              "providers": "INPUT_PROVIDERS",
              "serpApiLinks": "INPUT_SERPAPI_LINKS",
              "serpApiRawLog": "INPUT_SERPAPI_RAW_LOG",
              "serpApiEvents": "INPUT_SERPAPI_EVENTS",
              "aiEvents": "INPUT_AI_EVENTS",
              "clearArchive": "INPUT_CLEAR_ARCHIVE",
          }

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key, env_name in mapping.items():
                  value = values.get(key, defaults[key])
                  if isinstance(value, (list, dict)):
                      value = json.dumps(value)
                  env_file.write(f"{env_name}={value}\n")
          PY

      - name: Configure Git identity for incremental progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run scraper
        run: python scrape_and_email.py

      - name: Commit and publish scraped files (retry on concurrent pushes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Another workflow or a progress update can advance main between fetch and push.
          # Retry from the latest remote commit while preserving the scraper's generated files.
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt/5"
            git fetch origin main
            git reset --mixed origin/main
            git add events.json scrape_log.txt scrape-progress.json

            if git diff --cached --quiet; then
              echo "No generated changes to publish."
              exit 0
            fi

            git commit -m "Publish scraped events and progress"

            if git push origin HEAD:main; then
              echo "Scraped files published successfully."
              exit 0
            fi

            echo "Push rejected because main changed concurrently; retrying from latest origin/main."
            sleep $((attempt * 2))
          done

          echo "::error::Could not publish scraper output after 5 attempts because main kept changing."
          exit 1
